<div style="padding:8px 14px;background:#130606;border-bottom:1px solid #3a1111;color:#ff5a52;font-size:11px;font-weight:800;letter-spacing:2px">BETA 07 · ADAPTIVE PROGRESSION</div><nav id="nv"></nav><div class="w" id="app"></div><div id="tm" onclick="rs0()"></div><div id="t"></div>
<script>
const MU=['Pecho','Espalda','Hombro','Bíceps','Tríceps','Cuádriceps','Isquios','Glúteo','Gemelo','Abdomen'];

const E=`Press banca plana|0|1|g;Press inclinado con mancuernas|0|1|d;Press inclinado con barra|0|1|g;Press en máquina|0|1|g;Fondos en paralelas|0|1|b;Flexiones lastradas|0|1|b;Aperturas en polea|0|0|g;Aperturas con mancuernas|0|0|d;Pec deck|0|0|g;Dominadas|1|1|b;Jalón al pecho|1|1|g;Remo con barra|1|1|g;Remo con mancuerna|1|1|d;Remo en T|1|1|g;Remo en polea baja|1|1|g;Remo invertido|1|1|b;Pullover en polea|1|0|g;Press militar con barra|2|1|g;Press de hombro con mancuernas|2|1|d;Pike push-up|2|1|b;Elevaciones laterales|2|0|d;Laterales en polea|2|0|g;Pájaros con mancuernas|2|0|d;Face pull|2|0|g;Curl con barra|3|0|g;Curl con mancuernas|3|0|d;Curl martillo|3|0|d;Curl predicador|3|0|g;Curl inclinado|3|0|d;Press cerrado|4|1|g;Press francés|4|0|g;Extensión en polea|4|0|g;Extensión sobre la cabeza|4|0|d;Fondos en banco|4|0|b;Flexiones diamante|4|1|b;Sentadilla trasera|5|1|g;Prensa de piernas|5|1|g;Sentadilla hack|5|1|g;Sentadilla búlgara|5|1|d;Sentadilla goblet|5|1|d;Zancadas|5|1|d;Extensión de cuádriceps|5|0|g;Sentadilla a una pierna|5|1|b;Peso muerto rumano|6|1|g;Peso muerto rumano con mancuernas|6|1|d;Curl femoral tumbado|6|0|g;Curl femoral sentado|6|0|g;Curl nórdico|6|0|b;Buenos días|6|1|g;Hip thrust|7|1|g;Hip thrust con mancuerna|7|1|d;Patada en polea|7|0|g;Abducción en máquina|7|0|g;Puente de glúteo a una pierna|7|0|b;Gemelo de pie|8|0|g;Gemelo sentado|8|0|g;Gemelo con mancuerna|8|0|d;Gemelo en escalón|8|0|b;Crunch en polea|9|0|g;Elevación de piernas|9|0|b;Rueda abdominal|9|0|b;Plancha|9|0|b;Crunch|9|0|b`.split(';').map(s=>{const[n,m,c,q]=s.split('|');return{n,m:MU[m],c:+c,q}});
const SL={FB:[[5,1],[0,1],[1,1],[6,1],[2,1],[3,1],[4,1]],U:[[0,2],[1,2],[2,1],[3,1],[4,1]],L:[[5,2],[6,2],[7,1],[8,1],[9,1]],P:[[0,2],[2,2],[4,2]],Q:[[1,3],[2,1],[3,2]],L2:[[5,2],[6,2],[7,1],[8,1]]};
const NM={FB:'Full Body',U:'Torso',L:'Pierna',P:'Empuje',Q:'Tirón',L2:'Pierna'};
const TP={2:['FB','FB'],3:['FB','FB','FB'],4:['U','L','U','L'],5:['P','Q','L2','U','L'],6:['P','Q','L2','P','Q','L2']};
const RP={h:{c:[6,10],i:[10,15]},f:{c:[3,6],i:[8,12]},m:{c:[5,8],i:[8,12]}};
const GL={h:'Hipertrofia',m:'Mixto',f:'Fuerza'},LV=['Principiante','Intermedio','Avanzado'],MD={lineal:'Lineal',dup:'Ondulada (DUP)',bloques:'Bloques'};
const DEF={goal:'h',lv:1,days:4,eq:'g',focus:'',weeks:8,model:'lineal',de:4,dv:0.5};
let R=(()=>{try{const r=JSON.parse(localStorage.getItem('dmrb.v1'));if(r&&Array.isArray(r.days)){r.cfg=Object.assign({},DEF,r.cfg);return r}}catch(e){}return{name:'Mi rutina',cfg:{...DEF},days:[]}})();
let S={tab:0,wk:0,pk:null,out:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sv(){try{localStorage.setItem('dmrb.v1',JSON.stringify(R));return true}catch(e){toast('No se pudo guardar: exporta una copia y libera espacio del navegador.');return false}}
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const op=(a,v)=>a.map(([k,t])=>`<option value="${k}"${k==v?' selected':''}>${t}</option>`).join('');
const sl=(k,a,l)=>`<label>${l}<select onchange="cf('${k}',this.value)">${op(a,R.cfg[k])}</select></label>`;
function cf(k,v){R.cfg[k]=['lv','days','weeks','de','dv'].includes(k)?+v:v;sv()}
function mkx(e,f){const c=R.cfg,rp=RP[c.goal][e.c?'c':'i'];return{n:e.n,m:e.m,c:e.c,sets:(e.c?[2,3,4][+c.lv]:[2,3,3][+c.lv])+f,reps:rp.slice(),rest:e.c?(c.goal=='f'?180:150):75}}
function gen(){const c=R.cfg,ok=e=>c.eq=='g'||(c.eq=='d'&&e.q!='g')||(c.eq=='b'&&e.q=='b'),occ={},cnt={},days=[];
TP[c.days].forEach((k,di)=>{cnt[k]=(cnt[k]||0)+1;const used=[],ex=[];
SL[k].forEach(([m,n])=>{const foc=MU[m]==c.focus?1:0,pool=E.filter(e=>e.m==MU[m]&&ok(e)),cs=pool.filter(e=>e.c),is=pool.filter(e=>!e.c),u=occ[m]=(occ[m]||0)+1;
for(let i=0;i<n+foc;i++){const a=(i==0&&cs.length)?cs:(is.length?is:cs);if(!a.length)break;let p;for(let t=0;t<a.length;t++){p=a[(u-1+Math.max(0,i-1)+t)%a.length];if(!used.includes(p.n))break}
if(used.includes(p.n))continue;used.push(p.n);ex.push(mkx(p,foc))}});
days.push({name:NM[k]+' '+'ABC'[cnt[k]-1],ex})});
R.days=days;S.tab=2;S.wk=0;sv();render();toast('Rutina generada')}
function blank(){R.days=[{name:'Día 1',ex:[]}];sv();S.tab=1;render()}
function wi(w){const c=R.cfg,D=+c.de,W=+c.weeks;let nd=0,t=0;for(let i=0;i<W;i++){if(!(D>0&&(i+1)%D==0)){t++;if(i<w)nd++}}return{dl:D>0&&(w+1)%D==0,pos:D>0?w%D:w,ph:Math.min(2,Math.floor(nd*3/Math.max(1,t)))}}
function xw(x,di,w){const c=R.cfg,i=wi(w),lv=+c.lv,mr=[2,1,0][lv],r0=[4,3,3][lv];let s=x.sets,lo=x.reps[0],hi=x.reps[1],rir,note;
if(i.dl){s=Math.max(1,Math.round(s*c.dv));rir=4;note='Descarga −10 %'}
else if(c.model=='bloques'){const p=i.ph;s=Math.max(1,s+[1,0,-1][p]);const sh=x.c?[3,0,-2][p]:[3,0,-1][p];lo+=sh;hi+=sh;rir=Math.max(mr,[3,2,1][p]);note=['Moderada','Sube ~2,5 %','Alta, marcas'][p]}
else{s+=Math.min(2,Math.floor((i.pos+1)/2));rir=Math.max(mr,r0-i.pos);if(c.model=='dup'&&x.c){const sh=[-3,0,4][di%3];lo+=sh;hi+=sh}note=w==0?'Calibra al RIR':'+2,5 % o +1 rep'}
lo=Math.max(1,lo);hi=Math.max(lo+1,hi);return{s,lo,hi,rir,note}}
function tl(w){const i=wi(w),m=R.cfg.model;return i.dl?'Descarga':m=='bloques'?['Acumulación','Intensificación','Realización'][i.ph]:m=='dup'?'Ondulada':'Progresiva'}
function vol(w){const v={};R.days.forEach((d,di)=>d.ex.forEach(x=>v[x.m]=(v[x.m]||0)+xw(x,di,w).s));return v}
const tot=w=>Object.values(vol(w)).reduce((a,b)=>a+b,0);
function rirOf(w){const x=R.days[0]&&R.days[0].ex[0];return x?xw(x,0,w).rir:'-'}
const nvs=['GENERAR','EDITAR','PLAN','ENTRENO','HISTORIAL','PROGRESO','EXPORTAR','PRO'];
function vG(){return`<div class=card><h3>Generador automático</h3><label>Nombre<input value="${esc(R.name)}" onchange="R.name=this.value;sv()"></label><div class=g2>${sl('goal',[['h','Hipertrofia'],['m','Mixto'],['f','Fuerza']],'Objetivo')}${sl('lv',[[0,'Principiante'],[1,'Intermedio'],[2,'Avanzado']],'Nivel')}${sl('days',[2,3,4,5,6].map(n=>[n,n+' días']),'Días / semana')}${sl('eq',[['g','Gimnasio'],['d','Mancuernas'],['b','Casa']],'Material')}</div>${sl('focus',[['','Sin prioridad'],...MU.map(m=>[m,m])],'Músculo prioritario (+1 ejercicio y +1 serie)')}</div>
<div class=card><h3>Periodización y descargas</h3><div class=g2>${sl('weeks',[4,5,6,7,8,9,10,11,12].map(n=>[n,n+' semanas']),'Mesociclo')}${sl('model',Object.entries(MD),'Modelo')}${sl('de',[[0,'Sin descarga'],[3,'Cada 3 sem.'],[4,'Cada 4 sem.'],[5,'Cada 5 sem.'],[6,'Cada 6 sem.']],'Descarga')}${sl('dv',[[0.4,'40 % series'],[0.5,'50 % series'],[0.6,'60 % series']],'Volumen en descarga')}</div><p class=m>El RIR objetivo y las series cambian según el modelo. La descarga reduce las series; la app no calcula automáticamente una carga en kg. Los ajustes valen también para rutinas manuales. Generar sustituye la rutina actual.</p></div>
<button class=btn onclick="gen()">GENERAR RUTINA</button><button class="btn g" onclick="blank()">CREAR MANUAL EN BLANCO</button>`}
function vE(){if(!R.days.length)return`<div class=card>No hay rutina. Genera una o empieza una en blanco.</div><button class=btn onclick="blank()">NUEVA RUTINA MANUAL</button>`;let h='';
R.days.forEach((d,i)=>{h+=`<div class=card><div class=row><input value="${esc(d.name)}" onchange="R.days[${i}].name=this.value;sv()"><button class="btn g s" onclick="dd(${i})">✕</button></div>`;
d.ex.forEach((x,j)=>{h+=`<div class=ex><b>${esc(x.n)}</b><small>${x.m}</small><div class=ctl><button class=b onclick="ch(${i},${j},-1)">−</button><b>${x.sets}</b><button class=b onclick="ch(${i},${j},1)">+</button><input class=n type=number inputmode=numeric value=${x.reps[0]} onchange="rp(${i},${j},0,this.value)"><span>–</span><input class=n type=number inputmode=numeric value=${x.reps[1]} onchange="rp(${i},${j},1,this.value)"><button class=b onclick="mv(${i},${j},-1)">↑</button><button class=b onclick="mv(${i},${j},1)">↓</button><button class=b onclick="rx(${i},${j})">✕</button></div></div>`});
if(S.pk&&S.pk.d==i){h+=`<div class=chips>${MU.map(m=>`<button class="chip${S.pk.m==m?' on':''}" onclick="S.pk.m='${m}';render()">${m}</button>`).join('')}</div>`;E.forEach((e,k)=>{if(e.m==S.pk.m)h+=`<button class="chip" style="width:100%;text-align:left;margin-bottom:5px" onclick="ad(${i},${k})">+ ${e.n}</button>`});h+=`<button class="btn g" onclick="S.pk=null;render()">CERRAR</button>`}
else h+=`<button class="btn g" onclick="S.pk={d:${i},m:'Pecho'};render()">+ AÑADIR EJERCICIO</button>`;h+=`</div>`});
return h+`<button class=btn onclick="R.days.push({name:'Día '+(R.days.length+1),ex:[]});sv();render()">+ AÑADIR DÍA</button>`}
function dd(i){R.days.splice(i,1);S.pk=null;sv();render()}
function ch(i,j,d){const x=R.days[i].ex[j];x.sets=Math.max(1,Math.min(10,x.sets+d));sv();render()}
function rp(i,j,k,v){const x=R.days[i].ex[j];x.reps[k]=Math.max(1,+v||1);if(x.reps[1]<=x.reps[0])x.reps[1]=x.reps[0]+1;sv();render()}
function mv(i,j,d){const a=R.days[i].ex,k=j+d;if(k<0||k>=a.length)return;[a[j],a[k]]=[a[k],a[j]];sv();render()}
function rx(i,j){R.days[i].ex.splice(j,1);sv();render()}
function ad(i,k){R.days[i].ex.push(mkx(E[k],0));sv();render()}
function vP(){if(!R.days.length)return`<div class=card>Aún no hay rutina. Genera una automática o crea una manual.</div>`;const W=+R.cfg.weeks,w=Math.min(S.wk,W-1);
let h=`<div class=card><h3>${esc(R.name)}</h3><div class=chips>`;for(let i=0;i<W;i++)h+=`<button class="chip${i==w?' on':''}" onclick="S.wk=${i};render()">S${i+1}${wi(i).dl?' ▼':''}</button>`;
h+=`</div><b>Semana ${w+1}: ${tl(w)}</b><p class=m>RIR objetivo ${rirOf(w)} · ${tot(w)} series semanales</p></div>`;
R.days.forEach((d,di)=>{h+=`<div class=card><h3>${esc(d.name)}</h3>`;d.ex.forEach(x=>{const k=xw(x,di,w);h+=`<div class=pl><span>${esc(x.n)}</span><em>${k.s} × ${k.lo}–${k.hi}</em><span>RIR ${k.rir}</span><span class=no>${x.m} · descanso ${x.rest} s · ${k.note}</span></div>`});h+=`</div>`});
const v=vol(w);h+=`<div class=card><h3>Volumen semanal por músculo</h3>`;MU.forEach(m=>{if(!v[m])return;const[a,b,c]=LM[m],n=v[m],st=n<a?'bajo':n<=b?'óptimo':n<=c?'alto':'excesivo';h+=`<div class=vb><span>${m}</span><div><i style="width:${Math.min(100,n/c*100)}%"></i></div><span>${n} · ${st}</span></div>`});h+=`<p class=m>Referencia orientativa de series efectivas por semana (mínimo, óptimo, máximo recuperable).</p></div><div class=card><h3>Mesociclo</h3><table><tr><th>Sem.</th><th>Fase</th><th>RIR</th><th>Series</th></tr>`;
for(let i=0;i<W;i++)h+=`<tr class="${wi(i).dl?'dl':''}"><td>${i+1}</td><td>${tl(i)}</td><td>${rirOf(i)}</td><td>${tot(i)}</td></tr>`;return h+`</table></div>`}
function vX(){return`<div class=card><h3>Exportar</h3><button class=btn onclick="xp('pdf')">PDF IMPRIMIBLE</button><button class="btn g" onclick="xp('csv')">HOJA EDITABLE (CSV)</button><button class="btn g" onclick="xp('json')">COPIA EDITABLE (JSON)</button><label>Importar copia JSON<input type=file accept=".json,application/json" onchange="imp(this)"></label><p class=m>Gratis y sin cuenta. Tus datos se guardan solo en este dispositivo.</p></div>${S.out?`<div class=card><h3>Copia manual</h3><textarea rows=8 readonly>${esc(S.out)}</textarea></div>`:''}`}
function rows(){const r=[['Semana','Fase','Día','Ejercicio','Músculo','Series','Reps','RIR','Descanso (s)','Carga']];for(let w=0;w<+R.cfg.weeks;w++)R.days.forEach((d,di)=>d.ex.forEach(x=>{const k=xw(x,di,w);r.push([w+1,tl(w),d.name,x.n,x.m,k.s,k.lo+'-'+k.hi,k.rir,x.rest,k.note])}));return r}

function proProgression(){
 const all=[...new Set(L.sessions.flatMap(s=>s.ex.map(x=>x.n)))].sort();
 if(!all.length)return `<div class=card><h3>PRO · PROGRESIÓN INTELIGENTE</h3><p>Registra entrenamientos con peso, repeticiones y RIR para recibir recomendaciones personalizadas aquí.</p><p class=m>Las recomendaciones son orientativas: confirma siempre técnica, recuperación y seguridad antes de subir carga.</p></div>`;
 const cards=all.map(n=>{
  const sessions=L.sessions.filter(s=>s.ex.some(x=>x.n===n)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,2);
  const latest=sessions[0], ex=latest.ex.find(x=>x.n===n), sets=(ex?.sets||[]).filter(y=>Number.isFinite(+y.kg)&&+y.kg>0&&Number.isFinite(+y.reps)&&+y.reps>0);
  if(!sets.length)return '';
  const validRir=sets.filter(y=>y.rir!==''&&y.rir!=null&&Number.isFinite(+y.rir)).map(y=>+y.rir);
  const avgRir=validRir.length?validRir.reduce((a,b)=>a+b,0)/validRir.length:null;
  const avgReps=sets.reduce((a,b)=>a+(+b.reps),0)/sets.length;
  const maxKg=Math.max(...sets.map(y=>+y.kg));
  let status='MANTENER CARGA',detail='Repite la carga y busca consolidar las repeticiones con técnica limpia.',color='';
  if(avgRir!==null&&avgRir>=3&&avgReps>=8){status='VALORA SUBIR';detail='Has terminado con margen. Si todas las series fueron sólidas y el rango objetivo está cumplido, prueba el incremento mínimo disponible.';}
  else if(avgRir!==null&&avgRir<=1){status='NO SUBIR AÚN';detail='El esfuerzo fue alto. Mantén la carga o reduce ligeramente si la técnica o la recuperación se resienten.';}
  else if(avgReps<6){status='CONSOLIDAR REPETICIONES';detail='Prioriza mejorar las repeticiones antes de aumentar el peso.';}
  const prior=sessions[1];
  let compare='';
  if(prior){const px=prior.ex.find(x=>x.n===n),ps=(px?.sets||[]).filter(y=>+y.kg>0&&+y.reps>0);if(ps.length){const prevVol=ps.reduce((a,y)=>a+(+y.kg)*(+y.reps),0),nowVol=sets.reduce((a,y)=>a+(+y.kg)*(+y.reps),0);const delta=prevVol?Math.round((nowVol-prevVol)/prevVol*100):null;compare=delta===null?'':`Volumen frente a la sesión anterior: ${delta>0?'+':''}${delta}%.`;}}
  return `<div class=ex><b>${esc(n)}</b><p><span class=chip>${status}</span></p><p>${detail}</p><p class=m>Última sesión: ${esc(latest.date)} · ${sets.length} series válidas · carga máxima registrada ${maxKg} kg${avgRir===null?'':' · RIR medio '+avgRir.toFixed(1)}</p><p class=m>${compare}</p></div>`;
 }).filter(Boolean).join('');
 return `<div class=card><h3>PRO · PROGRESIÓN INTELIGENTE</h3><p>Recomendaciones basadas en tus sesiones guardadas. Registra el RIR para afinarlas.</p>${cards||'<p>Aún faltan series válidas para generar recomendaciones.</p>'}<p class=m>Regla inicial conservadora, no diagnóstico ni prescripción automática. Comprueba el rango de repeticiones de tu rutina y usa el incremento mínimo disponible.</p></div>`;
}

function dm5GoalPanel(){
 const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-(start.getDay()+6)%7);
 const wk=(L.sessions||[]).filter(s=>{const d=new Date((s.date||'')+'T00:00:00');return Number.isFinite(d.getTime())&&d>=start&&d<=now;});
 const workoutCount=wk.length,activeDays=new Set(wk.map(s=>s.date)).size;
 const setCount=wk.reduce((n,s)=>n+(s.ex||[]).reduce((m,e)=>m+(e.sets||[]).filter(z=>+z.reps>0).length,0),0);
 const pct=(a,b)=>Math.min(100,Math.round((a/Math.max(1,b))*100));
 const ps=pct(workoutCount,DM5GOALS.sessions),pt=pct(setCount,DM5GOALS.sets);
 const bar=(v)=>`<div style="height:8px;background:#292929;border-radius:8px;overflow:hidden;margin:6px 0 12px"><div style="height:100%;width:${v}%;background:var(--rd);border-radius:8px"></div></div>`;
 return `<div class=card><h3>BETA 07 · OBJETIVOS Y ADHERENCIA</h3><p class=m>Define objetivos realistas y mide tu constancia semanal con los entrenos guardados en este dispositivo.</p><div class=g2><label>Objetivo de entrenos/semana<input id=dm5sessions type=number min=1 max=7 value="${DM5GOALS.sessions}"></label><label>Objetivo de series/semana<input id=dm5sets type=number min=1 max=300 value="${DM5GOALS.sets}"></label></div><label>Enfoque de la semana (opcional)<input id=dm5note maxlength=160 value="${esc(DM5GOALS.note)}" placeholder="Ej. técnica limpia, dormir mejor..."></label><button class=btn onclick="dm5SaveGoals()">GUARDAR OBJETIVOS</button><div class=g2><div class=ex><div class=m>ENTRENOS</div><h2>${workoutCount}/${DM5GOALS.sessions}</h2><p class=m>${ps}% del objetivo</p>${bar(ps)}</div><div class=ex><div class=m>SERIES REGISTRADAS</div><h2>${setCount}/${DM5GOALS.sets}</h2><p class=m>${pt}% del objetivo</p>${bar(pt)}</div></div><div class=ex><div class=m>DÍAS ACTIVOS</div><h2>${activeDays}</h2><p class=m>De lunes a hoy · cuentan los días distintos con al menos un entreno.</p></div><p><b>${ps>=100&&pt>=100?'Objetivos semanales alcanzados. Buen trabajo.':ps>=100||pt>=100?'Vas avanzando: céntrate en completar el objetivo que queda.':'La constancia gana a la perfección. Ajusta los objetivos a tu semana real.'}</b></p>${DM5GOALS.note?`<p class=m>Enfoque: ${esc(DM5GOALS.note)}</p>`:''}<p class=m>La adherencia refleja solo los registros introducidos, no la calidad de la sesión ni la recuperación. No añadas series únicamente para alcanzar una cifra.</p></div>`;
}

function dm7AdaptiveProgression(){
 const sessions=(L&&Array.isArray(L.sessions)?L.sessions:[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
 const all=[...new Set(sessions.flatMap(s=>(s.ex||[]).map(x=>x.n).filter(Boolean)))].sort();
 if(!all.length)return `<div class=card><h3>BETA 07 · PROGRESIÓN ADAPTATIVA</h3><p class=m>Guarda entrenamientos con kilos, repeticiones y RIR para recibir recomendaciones basadas en tus registros.</p><p>Aún no hay datos suficientes. Registra al menos dos sesiones del mismo ejercicio para comparar tu rendimiento.</p></div>`;
 const advice=all.map(name=>{const rows=sessions.filter(s=>(s.ex||[]).some(x=>x.n===name)).map(s=>({date:s.date,ex:s.ex.find(x=>x.n===name)})).filter(r=>r.ex&&Array.isArray(r.ex.sets));
 const last=rows[rows.length-1],prev=rows[rows.length-2];
 const sets=(last?.ex?.sets||[]).filter(x=>Number.isFinite(+x.kg)&&+x.kg>0&&Number.isFinite(+x.reps)&&+x.reps>0);
 if(!sets.length)return null;
 const avgRir=sets.map(x=>Number.isFinite(+x.rir)&&x.rir!==''?+x.rir:null).filter(x=>x!==null);
 const rir=avgRir.length?avgRir.reduce((a,b)=>a+b,0)/avgRir.length:null;
 const best=Math.max(...sets.map(x=>e1(+x.kg,+x.reps)));
 const oldSets=(prev?.ex?.sets||[]).filter(x=>+x.kg>0&&+x.reps>0);
 const oldBest=oldSets.length?Math.max(...oldSets.map(x=>e1(+x.kg,+x.reps))):0;
 let status='MANTENER',detail='Repite una ejecución limpia y registra el RIR para afinar la recomendación.',kind='';
 if(oldBest&&best>oldBest*1.025){status='PROGRESO';detail='Tu e1RM estimado supera la sesión anterior. Consolida el rendimiento antes de volver a subir.';kind='good'}
 else if(rir!==null&&rir>=2.5&&sets.every(x=>+x.reps>=6)){status='POSIBLE SUBIDA';detail='Has terminado con margen. Si la técnica fue estable y alcanzaste el rango objetivo, prueba el incremento mínimo disponible en la próxima sesión.';kind='good'}
 else if(rir!==null&&rir<1){status='VIGILAR FATIGA';detail='Has trabajado muy cerca del fallo. Mantén la carga o reduce si la técnica se deterioró; no fuerces una subida.';kind='warn'}
 else if(oldBest&&best<=oldBest*0.975){status='REVISAR';detail='El e1RM estimado ha bajado. Comprueba descanso, técnica, orden del ejercicio y fatiga antes de cambiar el plan.';kind='warn'}
 return {name,date:last.date||'',sets,best,rir,status,detail,kind,prev:!!prev};
 }).filter(Boolean).sort((a,b)=>{const rank={'VIGILAR FATIGA':0,'REVISAR':1,'POSIBLE SUBIDA':2,'MANTENER':3,'PROGRESO':4};return rank[a.status]-rank[b.status]});
 return `<div class=card><h3>BETA 07 · PROGRESIÓN ADAPTATIVA</h3><p class=m>Recomendaciones locales a partir de tus sesiones guardadas. La estimación e1RM orienta tendencias; no es una medición directa ni una orden automática para subir peso.</p><div class=g2><div class=ex><div class=m>EJERCICIOS ANALIZADOS</div><h2>${advice.length}</h2></div><div class=ex><div class=m>CON RIR REGISTRADO</div><h2>${advice.filter(a=>a.rir!==null).length}</h2></div></div>${advice.slice(0,12).map(a=>`<div class=ex><div class=hd><b>${esc(a.name)}</b><span class="pr" style="${a.kind==='good'?'color:#8be28b':a.kind==='warn'?'color:#ffb347':''}">${a.status}</span></div><p class=m>Última sesión: ${a.date?fd(a.date):'fecha no disponible'} · e1RM estimado: ${Math.round(a.best*10)/10} kg${a.rir!==null?' · RIR medio: '+(Math.round(a.rir*10)/10):' · RIR sin registrar'}</p><p>${esc(a.detail)}</p>${!a.prev?'<p class=m>Registra otra sesión para comparar con una referencia previa.</p>':''}</div>`).join('')}<p class=m>Regla de seguridad: las sugerencias no prescriben cargas; prioriza técnica, dolor cero y recuperación. Si aparece dolor o una pérdida inusual de rendimiento, detén el ejercicio y revisa la causa.</p></div>`;
}

<div class=card><h3>GRATIS · SIEMPRE</h3><p>✓ Generador de rutinas de 2–6 días</p><p>✓ Editor manual de ejercicios y series</p><p>✓ Mesociclo, modelos de periodización y descargas</p><p>✓ Registro de entrenos, descanso, historial, récords y gráficas</p><p>✓ Exportación PDF/CSV/JSON e importación de copias</p></div>

<div class=card><h3>MONETIZACIÓN · FASE FUTURA</h3><p>Precio orientativo a validar: 3,99 €/mes o 29,99 €/año. No es una oferta de compra activa y no hay prueba beta automática.</p><button class=btn onclick=copyPro()>COPIAR TEXTO PARA VALIDAR INTERÉS</button><p class=m>Antes de cobrar hará falta un sistema de pagos y validación de licencias en un servicio seguro.</p></div>`}
function copyPro(){const t='Estoy preparando DARK MUSCLE PRO: biblioteca de rutinas, progresión basada en rendimiento, análisis de volumen/fatiga, comparativas de mesociclos e informes avanzados. Precio beta que estoy valorando: 3,99 €/mes o 29,99 €/año. ¿Qué función te haría pagar y qué precio te parecería justo?';try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Texto copiado')).catch(()=>{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');e.remove();toast('Texto copiado')})}else{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');e.remove();toast('Texto copiado')}}catch(e){toast('No se pudo copiar; vuelve a intentarlo')}}

const _vX=vX;vX=function(){return _vX()+vL()};
